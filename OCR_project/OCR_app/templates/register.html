{% extends 'base.html' %} {% block content %}
<div class="container">
  <div class="form-wrapper">
    <div class="form-card">
      <div class="form-header">
        <h1>Course Registration</h1>
        <p>Fill out the form below to enroll in your selected course.</p>
      </div>

      <!-- Django Messages Framework -->
      {% if messages %} {% for message in messages %}
      <div
        class="alert alert-{% if message.tags %}{{ message.tags }}{% else %}info{% endif %}"
      >
        {{ message }}
      </div>
      {% endfor %} {% endif %}

      <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}

        <!-- Full Name -->
        <div class="form-group">
          <label for="id_name" class="form-label">Full Name</label>
          <input
            type="text"
            id="id_name"
            name="name"
            class="form-control"
            placeholder="e.g., John Doe"
            required
          />
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="id_email" class="form-label">Email Address</label>
          <input
            type="email"
            id="id_email"
            name="email"
            class="form-control"
            placeholder="e.g., john@example.com"
            required
          />
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="id_phone" class="form-label">Phone Number</label>
          <input
            type="tel"
            id="id_phone"
            name="phone"
            class="form-control"
            placeholder="e.g., +1 234 567 8900"
            required
          />
        </div>

        <!-- Course Selection -->
        <div class="form-group">
          <label for="id_course" class="form-label">Select Course</label>
          <select id="id_course" name="course" class="form-control" required>
            <option value="" disabled selected>-- Choose a course --</option>
            <option value="Python Programming">Python Programming</option>
            <option value="Web Development">Web Development</option>
            <option value="Data Science">Data Science</option>
            <option value="Artificial Intelligence">
              Artificial Intelligence
            </option>
            <option value="Database Management">Database Management</option>
          </select>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block">
          Complete Registration
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
