{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Online Course Registration{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="nav-container">
        <a href="/" class="brand">CoursePortal</a>
        <nav class="nav-links">
          <a href="/" class="nav-link">Home</a>
          <a href="/register/" class="nav-link">Register</a>
          <a href="/registrations/" class="nav-link">Registrations</a>
        </nav>
      </div>
    </header>

    <main class="main-content">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="container footer-container">
        <div class="footer-brand">
          <a href="/" class="footer-logo">Online Course Registration</a>
          <p>Learn practical skills. Build your future.</p>
        </div>

        <nav class="footer-links" aria-label="Footer navigation">
          <a href="/">Home</a>
          <a href="{% url 'register' %}">Register</a>
        </nav>
      </div>

      <div class="footer-bottom">
        <div class="container">
          <p>&copy; 2026 Online Course Registration. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
